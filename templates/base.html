<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ config.title }}{% endblock %}</title>
<style>
  body { max-width: 44rem; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; color: #222; background: #fff; }
  a { color: #0645ad; }
  h1, h2, h3 { line-height: 1.2; }
  ul { padding-left: 1.2rem; }
  li { margin: .3rem 0; }
  .tags a { margin-right: .5rem; }
  header nav a { margin-right: 1rem; }
  @media (prefers-color-scheme: dark) { body { color: #ddd; background: #111; } a { color: #8ab4f8; } }
</style>
</head>
<body>
<header><nav><a href="{{ get_url(path="/") }}">{{ config.title }}</a><a href="{{ get_url(path="/tags/") }}">Tags</a></nav></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
